# Records the system text magnifier on iOS 17 and 18 simulators, which Xcode 27
# can no longer download. Each job boots one iOS version with Xcode 16.4,
# installs the simulator Flutter.framework built by an earlier run of the
# engine workflow, runs the probe app's integration test in
# dev/speakblend_loupe_probe, and uploads a screen recording with the output.
name: Speakblend iOS simulator engine

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # The run that built and uploaded flutter-ios_debug_sim_unopt_arm64.
  ENGINE_RUN_ID: '42131081162'
  # The framework's engine artifacts; on master the version otherwise comes
  # from a hash of the engine sources.
  FLUTTER_PREBUILT_ENGINE_VERSION: bffa2f388151413c6bc31e369386f0c6eb0b8e66

jobs:
  record:
    name: iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 18.6 comes with the runner. 17.5 has UIStandardTextCursorView and
        # 17.2 does not; both are downloaded by Xcode 16.
        ios: ['18.6', '17.5', '17.2']
    env:
      IOS: ${{ matrix.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter

      - name: Name the checkout's Flutter version
        # The shallow checkout has no tags, and a Flutter SDK of an unknown
        # version fails flutter_test's SDK constraint.
        run: git -C flutter tag 3.50.0-1.0.pre

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun simctl list runtimes
          df -h /

      - name: Download the iOS runtime
        run: |
          if xcrun simctl list runtimes | grep -q "^iOS $IOS "; then
            echo "iOS $IOS is already installed"
            exit 0
          fi
          # Apple's download server sometimes drops the connection.
          for attempt in 1 2 3; do
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS" && break
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 30
          done
          xcrun simctl list runtimes
          df -h /

      - name: Install the simulator engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter/bin/flutter precache --ios
          # A rerun of the engine run uploads the artifact again under the same
          # name; take the newest.
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ENGINE_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "flutter-ios_debug_sim_unopt_arm64")]
                  | sort_by(.created_at) | last | .id')
          mkdir engine
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > engine/artifact.zip
          unzip -q engine/artifact.zip -d engine
          cat engine/manifest-ios_debug_sim_unopt_arm64.txt
          unzip -q engine/Flutter.framework-ios_debug_sim_unopt_arm64.zip -d engine/unzipped
          framework=flutter/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64_x86_64-simulator/Flutter.framework
          lipo "$framework/Flutter" -replace arm64 engine/unzipped/Flutter.framework/Flutter \
            -output engine/Flutter.fat
          cp engine/Flutter.fat "$framework/Flutter"
          codesign --force --sign - "$framework/Flutter"
          lipo -info "$framework/Flutter"
          LC_ALL=C grep -a -q Magnifier.showSystemMagnifier "$framework/Flutter"

      - name: Create the probe app
        run: |
          # Outside the repository, so that it is not part of its pub workspace.
          cp -R flutter/dev/speakblend_loupe_probe "$RUNNER_TEMP/loupe_probe"
          cd "$RUNNER_TEMP/loupe_probe"
          "$GITHUB_WORKSPACE/flutter/bin/flutter" create --platforms=ios \
            --project-name loupe_probe --org com.speakblend .
          "$GITHUB_WORKSPACE/flutter/bin/flutter" pub get

      - name: Create and boot the simulator
        run: |
          read -r runtime version device < <(xcrun simctl list runtimes -j | python3 -c '
          import json, os, sys
          wanted = os.environ["IOS"]
          runtimes = [r for r in json.load(sys.stdin)["runtimes"]
                      if r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                      and r.get("isAvailable")
                      and (r["version"] == wanted or r["version"].startswith(wanted + "."))]
          runtimes.sort(key=lambda r: tuple(int(x) for x in r["version"].split(".")))
          runtime = runtimes[-1]
          iphones = [d["identifier"] for d in runtime.get("supportedDeviceTypes", [])
                     if d.get("productFamily") == "iPhone"]
          preferred = "com.apple.CoreSimulator.SimDeviceType.iPhone-15"
          device = preferred if preferred in iphones else iphones[-1]
          print(runtime["identifier"], runtime["version"], device)
          ')
          echo "Runtime $runtime ($version) on $device"
          udid=$(xcrun simctl create loupe "$device" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # The first keyboard on a new simulator shows a slide-to-type introduction.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true
          echo "UDID=$udid" >> "$GITHUB_ENV"
          echo "IOS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Record the integration test
        run: |
          out=$GITHUB_WORKSPACE/out
          mkdir -p "$out"
          cd "$RUNNER_TEMP/loupe_probe"
          # On GitHub Actions the default reporter names a test only after it
          # ends; the expanded one names it when it starts.
          "$GITHUB_WORKSPACE/flutter/bin/flutter" test integration_test/loupe_test.dart \
            --reporter expanded -d "$UDID" > "$out/test.log" 2>&1 &
          tester=$!
          # Start recording when the test starts on the simulator, after the build.
          while kill -0 "$tester" 2> /dev/null; do
            grep -q "long-press drags over every field" "$out/test.log" && break
            sleep 0.2
          done
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force \
            "$out/loupe-ios-$IOS_VERSION.mp4" > "$out/record.log" 2>&1 &
          recorder=$!
          status=0
          wait "$tester" || status=$?
          sleep 2
          kill -INT "$recorder"
          wait "$recorder" || true
          cat "$out/test.log"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loupe-ios-${{ matrix.ios }}
          path: out
